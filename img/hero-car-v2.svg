<g fill="#7b838e"><path d="M0 -8 L38 -26 A47 47 0 0 1 44 -8 Z"/><path d="M0 -8 L38 -26 A47 47 0 0 1 44 -8 Z" transform="rotate(72)"/><path d="M0 -8 L38 -26 A47 47 0 0 1 44 -8 Z" transform="rotate(144)"/><path d="M0 -8 L38 -26 A47 47 0 0 1 44 -8 Z" transform="rotate(216)"/><path d="M0 -8 L38 -26 A47 47 0 0 1 44 -8 Z" transform="rotate(288)"/></g>
<circle r="10" fill="#5b636e"/></g></defs>
<ellipse cx="455" cy="300" rx="400" ry="22" fill="#000" opacity=".55" filter="url(#sh)"/>
<!-- body -->
<path d="M66 214 C62 180 80 160 120 152 L262 132 C312 84 372 56 452 50 C540 46 620 54 690 80 C740 100 780 128 812 150 C840 168 852 196 848 228 L844 252 C842 262 834 268 822 268 L762 268 A72 72 0 0 0 618 268 L332 268 A72 72 0 0 0 188 268 L94 268 C78 268 68 258 66 244 Z" fill="url(#bd)" stroke="#8a94a2" stroke-width="2"/>
