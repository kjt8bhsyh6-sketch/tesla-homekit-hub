<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t"><title id="t">Stylized white electric crossover SUV in profile with a full-width front light bar</title>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9edf2"/><stop offset="1" stop-color="#b9c1cc"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset=".6" stop-color="#141b26"/><stop offset="1" stop-color="#0b1018"/></linearGradient>
<radialGradient id="wh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e6e9ee"/><stop offset=".7" stop-color="#aab1bb"/><stop offset="1" stop-color="#6b737e"/></radialGradient>
<linearGradient id="lb" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe6ff"/></linearGradient>
<filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
